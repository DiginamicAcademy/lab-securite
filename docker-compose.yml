name: auf-securite-lab

services:
  db:
    image: mysql:8.4
    container_name: lab-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fromagerie
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  vulnerable:
    build: ./vulnerable
    container_name: lab-vulnerable
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: fromagerie
    ports:
      - "8080:8080"

  secure:
    build: ./secure
    container_name: lab-secure
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: fromagerie
      APP_SECRET_KEY: change-me-in-production-32chars-min
    ports:
      - "8081:8080"


  # TD J3 « exploiter / corriger une faille connue » :
  # mini-app Flask volontairement obsolète (Jinja2 3.1.2 épinglé dans
  # cve/requirements.txt, CVE-2024-22195). Le correctif attendu est double :
  # monter Jinja2 >= 3.1.3 (dépendance) ET corriger le code de l'app
  # (échappement/paramétrage) — cf. chapitre 09 du cours
  # cours-securite-vulnerabilites-attaques.
  cve:
    build: ./cve
    container_name: lab-cve
    ports:
      - "8082:8080"

volumes:
  db-data:
